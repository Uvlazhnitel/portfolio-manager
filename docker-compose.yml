services:
  postgres:
    image: postgres:17-alpine
    container_name: portfolio-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_manager
      POSTGRES_USER: portfolio_manager
      POSTGRES_PASSWORD: portfolio_manager
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_manager -d portfolio_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - portfolio_manager_postgres:/var/lib/postgresql/data

  app:
    build:
      context: .
    container_name: portfolio-manager-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://portfolio_manager:portfolio_manager@postgres:5432/portfolio_manager?schema=public
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    command: sh -c "pnpm db:deploy && pnpm db:seed && pnpm start"
    ports:
      - "127.0.0.1:3010:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/dashboard').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  history-worker:
    build:
      context: .
    container_name: portfolio-manager-history-worker
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://portfolio_manager:portfolio_manager@postgres:5432/portfolio_manager?schema=public
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    command: pnpm history:worker

volumes:
  portfolio_manager_postgres:
